<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#ffffff"/>
  
  <!-- Main icon container -->
  <g transform="translate(200, 200)">
    <!-- Background circle -->
    <circle cx="0" cy="0" r="80" fill="#6366f1" opacity="0.1"/>
    
    <!-- Clothing hanger icon -->
    <g transform="translate(0, -20)">
      <!-- Hanger hook -->
      <path d="M-20 -60 Q-20 -70 -10 -70 Q0 -70 0 -60 L0 -55 Q0 -50 -5 -50 Q-10 -50 -10 -55 Z" fill="#6366f1"/>
      
      <!-- Hanger body -->
      <path d="M-10 -55 L-10 -40 Q-10 -35 -5 -35 Q0 -35 0 -40 L0 -55" fill="none" stroke="#6366f1" stroke-width="4"/>
      
      <!-- Hanger bottom curve -->
      <path d="M-10 -40 Q-10 -30 -5 -30 Q0 -30 0 -40" fill="none" stroke="#6366f1" stroke-width="4"/>
      
      <!-- Small clothing item -->
      <ellipse cx="0" cy="-25" rx="10" ry="15" fill="#6366f1" opacity="0.3"/>
    </g>
  </g>
  
  <!-- Text "RopaNova" -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#6366f1">
    RopaNova
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">
    Fashion Marketplace
  </text>
</svg> 