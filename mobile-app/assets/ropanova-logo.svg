<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#ffffff"/>
  
  <!-- Main icon - clothing hanger -->
  <g transform="translate(200, 150)">
    <!-- Hanger hook -->
    <path d="M-15 -40 Q-15 -45 -8 -45 Q0 -45 0 -40 L0 -35 Q0 -30 -4 -30 Q-8 -30 -8 -35 Z" fill="#6366f1"/>
    
    <!-- Hanger body -->
    <path d="M-8 -35 L-8 -25 Q-8 -20 -4 -20 Q0 -20 0 -25 L0 -35" fill="none" stroke="#6366f1" stroke-width="3"/>
    
    <!-- Hanger bottom curve -->
    <path d="M-8 -25 Q-8 -18 -4 -18 Q0 -18 0 -25" fill="none" stroke="#6366f1" stroke-width="3"/>
    
    <!-- Small clothing item -->
    <circle cx="0" cy="-10" r="5" fill="#6366f1" opacity="0.3"/>
  </g>
  
  <!-- Text "RopaNova" -->
  <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#6366f1">
    RopaNova
  </text>
  
  <!-- Subtitle -->
  <text x="200" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">
    Fashion Marketplace
  </text>
</svg> 