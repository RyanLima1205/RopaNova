<svg width="420" height="90" viewBox="0 0 420 90" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RopaNova — The Digital Fashion Mall">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Montserrat:wght@500&amp;display=swap');
      .ropa { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 42px; fill: #FFFFFF; letter-spacing: 1px; }
      .nova { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 42px; fill: #000000; letter-spacing: 1px; }
      .tagline { font-family: Montserrat, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #2F8AFC; letter-spacing: 5px; }
    </style>
  </defs>

  <!-- Slanted bars -->
  <path d="M4 18 L18 8 L22 52 L8 62 Z" fill="#2F8AFC"/>
  <path d="M22 16 L36 6 L40 50 L26 60 Z" fill="#2F8AFC"/>

  <!-- ROPA blue box -->
  <path d="M48 12 L118 12 L112 58 L42 58 Z" fill="#2F8AFC" rx="2"/>
  <text x="54" y="48" class="ropa">ROPA</text>

  <!-- NOVA -->
  <text x="126" y="48" class="nova">NOVA</text>

  <!-- Tagline — single line -->
  <text x="210" y="78" text-anchor="middle" class="tagline">THE DIGITAL FASHION MALL</text>
</svg>
